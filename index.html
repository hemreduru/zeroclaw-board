<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>ZeroClaw Board</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body>
<aside class="rail"><a class="brand" href="/" aria-label="ZeroClaw Board">z<span>↗</span></a><span class="rail-line"></span><span class="rail-label">BOARD</span><span class="rail-bottom">ZC / 01</span></aside>
<main><header><div><div class="eyebrow">ZEROCLAW BOARD <span class="version">v0.2</span></div><h1 data-t="heading"></h1><p data-t="intro"></p></div><div class="controls"><span id="connection" role="status"></span><select id="language" aria-label="Language"><option value="tr">TR</option><option value="en">EN</option></select><button id="theme" class="icon" aria-label="Theme">◐</button><button id="logout" class="quiet" data-t="logout" hidden></button></div></header>
<section id="login" hidden><div class="login-card"><div class="eyebrow" data-t="private"></div><h2 data-t="welcome"></h2><p data-t="loginText"></p><form id="loginForm"><label for="token" data-t="token"></label><input id="token" type="password" autocomplete="off" required spellcheck="false"><button class="primary" data-t="enter"></button><p id="loginError" role="alert"></p></form><div class="login-note" data-t="tokenNote"></div></div><div class="login-art" aria-hidden="true"><span>observe.</span><span>understand.</span><span class="accent">stay in flow.</span><div class="art-lines">▤ ───────── ◉<br>　 └──── ▤ ────── ✓</div></div></section>
<section id="workspace" hidden><div class="sectionhead"><h2><span data-t="team"></span> <span id="agentCount" class="count"></span></h2><span class="muted" data-t="discovery"></span></div><div id="agents" class="agents"></div><div class="boardhead"><div class="tabs"><button class="selected" data-view="work" data-t="tasks"></button><button data-view="schedule"><span data-t="automations"></span> <span id="scheduleCount"></span></button></div><div class="filters"><select id="agentFilter" aria-label="Agent"></select><input id="search" type="search" data-placeholder="search" aria-label="Search"></div></div><div id="warning" role="status" hidden></div><div id="board" class="board"></div><footer><span data-t="readonly"></span><span id="updated"></span></footer><p class="footnote" data-t="note"></p></section>
</main></body></html>
